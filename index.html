<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" Unicode="U+1F334, UTF-8: F0 9F 8C B4" Unicode= "U+1F332, UTF-8: F0 9F 8C B2" Unicode= "U+00A9"  Unicode="U+00A9, UTF-8: C2 A9" Unicode="U+1F440, UTF-8: F0 9F 91 80">
    <title>Tic-Tac-Toe</title>
    <link HREF="https://fonts.googleapis.com/css?family=Dancing+Script|Indie+Flower|Shadows+Into+Light|Fresca|Nunito|Yoyu|Iceland|Arial|Yeseva One|Tagesschrift|du+NSW+ACT+Cursive|BenchNine|Birthstone|Jolly Lodger|Nosifer|Quicksand|Raleway" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <script src="https://kit.fontawesome.com/9f71dab2a2.js" crossorigin="anonymous"></script> -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/> -->

    <!-- <meta name="keywords" content="”> -->
</head>
<body>
    <div class="container">
        <div class="game-header">
            <div class="title">
                <h2>TIC-TAC-TOE</h2>
            </div>
            <div class="prompt" id="prompt">
                <h2>Please choose a square by clicking on it.</h2>
            </div>
            <div id="return-win"></div>
            <div class="gameboard">
                <table id="table">
                    <tr>
                        <td id="cell1"></td>
                        <td id="cell2"></td>
                        <td id="cell3"></td>
                    </tr>
                    <tr>
                        <td id="cell4"></td>
                        <td id="cell5"></td>
                        <td id="cell6"></td>
                    </tr>
                    <tr>
                        <td id="cell7"></td>
                        <td id="cell8"></td>
                        <td id="cell9"></td>
                    </tr>
                </table>
            </div>
            
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
